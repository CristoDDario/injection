<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveContainer Install - CristoDDario PRO</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #ff00ff, #ff66ff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #fff;
  }

  .container {
    background: rgba(0,0,0,0.85);
    border-radius: 20px;
    padding: 30px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255,0,255,0.5);
    transition: transform 0.2s;
  }

  .container:hover {
    transform: scale(1.03);
  }

  h1 {
    font-size: 26px;
    margin-bottom: 10px;
    color: #ff00ff;
    text-shadow: 0 0 8px #ff66ff;
  }

  p {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    text-align: center;
    margin-bottom: 20px;
    background: #2a2a2a;
    color: #fff;
    user-select: all;
  }

  button {
    background: linear-gradient(135deg, #ff66ff, #ff00ff);
    border: none;
    color: #fff;
    padding: 15px 28px;
    font-size: 18px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 10px rgba(255,0,255,0.5);
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 18px rgba(255,0,255,0.8);
  }

  button:active {
    transform: scale(0.97);
    box-shadow: 0 0 8px rgba(255,0,255,0.5);
  }

  footer {
    margin-top: 25px;
    font-size: 12px;
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>LiveContainer Mafia 🩷</h1>
    <p>Copia il link e incollalo in<br>LiveContainer → + → Incolla link diretto.</p>
    <input type="text" id="ipaLink" readonly>
    <button onclick="copyLink()">📋 Copia link IPA</button>
    <footer>Powered by CristoDDario PRO</footer>
  </div>

  <script>
    // prende ?ipa=link
    const params = new URLSearchParams(window.location.search);
    const ipa = params.get("ipa");

    const field = document.getElementById("ipaLink");

    if (ipa) {
      field.value = ipa;
    } else {
      field.value = "❌ Nessun link IPA fornito.";
    }

    function copyLink() {
      field.select();
      field.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(field.value)
        .then(() => alert("✅ Link copiato!"))
        .catch(() => alert("⚠️ Copia fallita, seleziona manualmente."));
    }
  </script>
</body>
</html>
